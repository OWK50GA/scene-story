steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west2-docker.pkg.dev/$PROJECT_ID/scene-story/frontend:latest"
      - "--build-arg"
      - "BACKEND_URL=${_BACKEND_URL}"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west2-docker.pkg.dev/$PROJECT_ID/scene-story/frontend:latest"
images:
  - "europe-west2-docker.pkg.dev/$PROJECT_ID/scene-story/frontend:latest"
